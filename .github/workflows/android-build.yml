name: Android build
on:
  push:
    branches:
      - feature/discord-bitchord-lyrics-sources
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android platform and native build tools
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - name: Build full debug APK and run unit tests
        run: ./gradlew --no-daemon :app:assembleFullDebug :app:testFullDebugUnitTest
