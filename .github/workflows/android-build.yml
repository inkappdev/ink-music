name: Android build
on:
  push:
    branches:
      - feature/discord-bitchord-lyrics-sources
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Add Android command-line tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK and native build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - name: Build full debug APK and run unit tests
        run: ./gradlew --no-daemon :app:assembleFullDebug :app:testFullDebugUnitTest
