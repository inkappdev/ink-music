# The Mac app, on each push that touches it: an unsigned arm64 .dmg, kept with the run (Actions,
# this workflow, its run, Artifacts). Unsigned: the first open is System Settings, Privacy &
# Security, Open Anyway (Apple's $99 a year only takes that step away).
name: mac
on:
  push:
    branches: [main]
    paths: ["desktop/**", "youtube/**", "core/**", "app/src/main/res/font/**", "app/src/main/assets/**", ".github/workflows/mac.yml", "*.gradle.kts", "app/build.gradle.kts", "gradle/**"]
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-15   # Apple Silicon
    # the signing certificate (below); empty, the build stays ad hoc as before
    env:
      P12: ${{ secrets.MAC_SIGN_P12 }}
      PASS: ${{ secrets.MAC_SIGN_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4

      # libmpv and everything it needs, beside it in the app (found through @loader_path), each
      # signed again (ad hoc) once its paths are rewritten, or macOS won't load it
      - name: libmpv, bundled
        run: |
          brew install mpv dylibbundler
          out=desktop/native/macos-arm64
          mkdir -p $out
          cp "$(brew --prefix mpv)/lib/libmpv.2.dylib" $out/
          chmod u+w $out/libmpv.2.dylib
          install_name_tool -id @loader_path/libmpv.2.dylib $out/libmpv.2.dylib
          dylibbundler -of -b -x $out/libmpv.2.dylib -d $out -p @loader_path/ -s "$(brew --prefix)/lib" < /dev/null
          chmod u+w $out/*.dylib
          codesign --force -s - $out/*.dylib
          du -sh $out; ls $out | wc -l

      - name: dmg
        run: ./gradlew :desktop:packageDmg -PdesktopOnly --no-daemon
        # ink music's Last.fm key and secret (the repository's secrets; without them, no Last.fm)
        env:
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      # signed as "ink music", one certificate of ink's own (made 2026-10-29, ~/.config/ink-music/ink-music-mac-sign.*,
      # the repository's MAC_SIGN_P12 and MAC_SIGN_PASS): not Apple's, so the first open is still Open Anyway, but
      # every build is the same app to macOS, which keeps what it was allowed (Local Network: an ad hoc build was a
      # new app each time, and its server went dark till allowed again; Bronson's Mac, 2026-10-29). Each piece of
      # code inside from the inside out (Java's runtime, libmpv's), then the app; the dmg opened writable to do it.
      - name: signed as ink music
        if: env.P12 != ''
        run: |
          set -euo pipefail
          echo "$P12" | base64 --decode > sign.p12
          kc="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p "" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "" "$kc"
          security import sign.p12 -k "$kc" -P "$PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm sign.p12
          id=$(security find-certificate -c "ink music" -Z "$kc" | awk '/SHA-1/ { print $3 }')
          dmg=$(ls desktop/build/compose/binaries/main/dmg/*.dmg)
          hdiutil convert "$dmg" -format UDRW -o rw.dmg
          hdiutil resize -size +40m rw.dmg
          hdiutil attach rw.dmg -nobrowse -mountpoint m
          app="m/ink music.app"
          find "$app/Contents" -type f \( -name '*.dylib' -o -name '*.jnilib' -o -perm -u+x \) -print0 |
            while IFS= read -r -d '' f; do file -b "$f" | grep -q Mach-O && codesign --force --sign "$id" --keychain "$kc" "$f"; done
          [ -d "$app/Contents/runtime" ] && codesign --force --sign "$id" --keychain "$kc" "$app/Contents/runtime"
          codesign --force --sign "$id" --keychain "$kc" "$app"
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -E "^(Identifier|Authority|Signature)="
          hdiutil detach m
          rm "$dmg"
          hdiutil convert rw.dmg -format UDZO -o "$dmg"
          security delete-keychain "$kc"

      - uses: actions/upload-artifact@v4
        with:
          name: ink-music-mac
          path: desktop/build/compose/binaries/main/dmg/*.dmg
